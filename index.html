<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080808">

    <title>SHAURYA AI | Your Intelligence</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="app">
        <header class="topbar">
            <h2>SHAURYA<span> AI</span></h2>
            <div class="status">● SYSTEM ONLINE</div>
        </header>

        <main class="main-content">
            <div class="ai-core">
                <div class="core-circle">
                    <span>S</span>
                </div>
            </div>

            <h1>I'm SHAURYA AI.</h1>
            <p>Your intelligence. Your command.</p>

            <div class="chat-box">
                <div id="messages">
                    <div class="welcome">
                        Hello! How can I help you today?
                    </div>
                </div>

                <div class="input-area">
                    <input
                        type="text"
                        id="userInput"
                        placeholder="Ask SHAURYA AI anything..."
                    >

                    <button id="sendBtn" type="button"></button>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
